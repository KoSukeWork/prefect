name: prefect-workbench
services:
  workbench:
    image: prefect-workbench:${WORKBENCH_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/workbench/Dockerfile
      target: standalone
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 60s
    environment:
      PREFECT_PASSWORD: ${PREFECT_PASSWORD:?Run setup.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 first}
      WORKER_LIMIT: ${WORKER_LIMIT:-4}
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_API_AUTH_STRING: "admin:${PREFECT_PASSWORD}"
      PREFECT_UI_URL: ${WORKBENCH_PUBLIC_URL:-http://localhost:8090}/prefect
      PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
      WORKBENCH_PUBLIC_URL: ${WORKBENCH_PUBLIC_URL:-http://localhost:8090}
    ports: ["127.0.0.1:${WORKBENCH_PORT:-8090}:8090"]
    volumes:
      - database-single:/var/lib/workbench-postgres
      - workspace:/workspace
      - business-env:/opt/workbench-env
      - editor-data:/home/app/.local/share/code-server
    healthcheck:
      test: [CMD, /opt/venv/bin/python, /opt/workbench/standalone/health.py]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 90s
volumes:
  database-single:
  workspace:
  business-env:
  editor-data:
