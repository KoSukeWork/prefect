pid /tmp/workbench-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/workbench-nginx/client;
    proxy_temp_path /tmp/workbench-nginx/proxy;
    fastcgi_temp_path /tmp/workbench-nginx/fastcgi;
    uwsgi_temp_path /tmp/workbench-nginx/uwsgi;
    scgi_temp_path /tmp/workbench-nginx/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8090;
        server_name _;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        location = /_session {
            internal;
            proxy_pass http://127.0.0.1:8091/api/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Forwarded-Host $http_host;
        }
        location = /editor { return 302 /editor/; }
        location @login { return 302 /; }
        location /editor/ {
            auth_request /_session;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:8081/;
        }
        location = /prefect { return 302 /prefect/; }
        location /prefect/api/ {
            auth_request /_session;
            proxy_pass http://127.0.0.1:4200/api/;
        }
        location /prefect/ {
            auth_request /_session;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:4200;
        }
        location / { proxy_pass http://127.0.0.1:8091; }
    }
}
